name: Rule 1 scan

on:
  schedule:
    - cron: "0 17 * * *"   # every day at 17:00 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write   # to publish results to the `data` branch

concurrency:
  group: rule1-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore the previous scan from the data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
          fi
          ls -la data

      # Financials: only stocks not refreshed in the last 6 days (and new ones), so each stock is
      # updated about once a week. Stops early if Yahoo blocks requests; the next run continues.
      - name: Refresh fundamentals (stale or new stocks only)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m rule1.scanner fundamentals

      - name: Prices, timing tools, news and email alerts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m rule1.scanner prices

      - name: Publish results to the data branch
        if: always() && hashFiles('data/results.json') != ''
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "rule1-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
